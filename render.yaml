services:
  - type: web
    name: sorumate-web
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # --proxy-headers: Render sits behind a proxy; without it every visitor looks like the same IP
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
